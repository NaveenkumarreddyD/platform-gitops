# The Mongo CA is generated once, stored in Vault, and rendered here by AVP.
# cert-manager signs the server certificate with the same CA trusted by MAS and SLS.
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: "{{ .Values.resource }}-ca"
  namespace: "{{ .Values.namespace }}"
  annotations:
    # Argo CD must not delete the signing CA during a non-pruning installation.
    argocd.argoproj.io/sync-options: Prune=false
data:
  tls.crt: {{ .Values.mongoCaCert }}
  tls.key: {{ .Values.mongoCaKey }}
  ca.crt:  {{ .Values.mongoCaCert }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: { name: "{{ .Values.resource }}-ca-issuer", namespace: "{{ .Values.namespace }}" }
spec: { ca: { secretName: "{{ .Values.resource }}-ca" } }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: "{{ .Values.resource }}-server", namespace: "{{ .Values.namespace }}" }
spec:
  secretName: "{{ .Values.resource }}-server-cert"
  duration: 8760h
  issuerRef: { name: "{{ .Values.resource }}-ca-issuer", kind: Issuer }
  dnsNames:
    - "{{ .Values.resource }}-svc.{{ .Values.namespace }}.svc.cluster.local"
    - "*.{{ .Values.resource }}-svc.{{ .Values.namespace }}.svc.cluster.local"
