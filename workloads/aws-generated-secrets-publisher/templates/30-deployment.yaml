apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-generated-secrets-publisher
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: aws-generated-secrets-publisher
    app.kubernetes.io/part-of: mas-platform
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-generated-secrets-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-generated-secrets-publisher
        app.kubernetes.io/part-of: mas-platform
    spec:
      serviceAccountName: aws-generated-secrets-publisher
      automountServiceAccountToken: true
      containers:
        - name: publisher
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/publisher/publish.sh"]
          env:
            - { name: ACCOUNT_ID, value: {{ .Values.accountId | quote }} }
            - { name: CLUSTER_ID, value: {{ .Values.clusterId | quote }} }
            - { name: INSTANCE_ID, value: {{ .Values.instanceId | quote }} }
            - { name: DRO_NAMESPACE, value: {{ .Values.droNamespace | quote }} }
            - { name: SLS_NAMESPACE, value: {{ .Values.slsNamespace | quote }} }
            - { name: POLL_SECONDS, value: {{ .Values.pollSeconds | quote }} }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: {{ .Values.authConfigMap }}, key: region } }
            # One Identity Safeguard A2A inputs consumed by the credential_process.
            - name: SAFEGUARD_A2A_URL
              valueFrom: { configMapKeyRef: { name: {{ .Values.authConfigMap }}, key: safeguardA2aUrl } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { configMapKeyRef: { name: {{ .Values.authConfigMap }}, key: accessKeyId } }
            - name: CREDENTIAL_TTL_SECONDS
              valueFrom: { configMapKeyRef: { name: {{ .Values.authConfigMap }}, key: credentialTtlSeconds } }
            - { name: AWS_CONFIG_FILE, value: /etc/aws/config }
            - { name: AWS_PROFILE, value: default }
            - { name: AWS_SDK_LOAD_CONFIG, value: "1" }
            - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
            - { name: HOME, value: /tmp/home }
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe:
            exec: { command: ["test", "-f", "/tmp/publisher-started"] }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["test", "-f", "/tmp/last-success"] }
            failureThreshold: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: publisher-script, mountPath: /opt/publisher/publish.sh, subPath: publish.sh, readOnly: true }
            - { name: credential-process, mountPath: /usr/local/bin/oneidentity-credential-process, subPath: credential-process.sh, readOnly: true }
            - { name: credential-process, mountPath: /etc/aws/config, subPath: config, readOnly: true }
            - { name: oneidentity-identity, mountPath: /var/run/secrets/oneidentity, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: publisher-script
          configMap: { name: aws-generated-secrets-publisher, defaultMode: 365 }
        - name: credential-process
          configMap: { name: oneidentity-credential-process, defaultMode: 365 }
        - name: oneidentity-identity
          secret: { secretName: {{ .Values.identitySecret }}, defaultMode: 288 }
        - { name: tmp, emptyDir: {} }
