# MongoDB Controllers for Kubernetes Operator. The bootstrap selects a chart
# version compatible with the live OpenShift release before creating this app.
{{- if has .Values.component (list "mongodb-operator" "mongodb" "all") }}
---
# Install the vendor operator directly from MongoDB's official Helm repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-operator
  namespace: {{ .Values.argoNamespace }}
  labels: { app.kubernetes.io/part-of: mas-platform, mas.ibm.com/component: mongodb }
  annotations: { argocd.argoproj.io/sync-wave: "20" }
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  revisionHistoryLimit: 10
  project: {{ .Values.project }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ include "gitops.mongoNs" . }}
  source:
    repoURL: {{ .Values.mongoOperator.repo }}
    chart: {{ .Values.mongoOperator.chart }}
    targetRevision: {{ .Values.mongoOperator.version | quote }}
    helm:
      releaseName: mongodb-kubernetes-operator
      values: |
        namespace: {{ include "gitops.mongoNs" . }}
        managedSecurityContext: true
        operator:
          watchedResources:
            - mongodbcommunity
          createOperatorServiceAccount: true
          createResourcesServiceAccountsAndRoles: true
          webhook:
            registerConfiguration: true
  syncPolicy:
    automated: { prune: {{ .Values.auto_delete }}, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
    syncOptions: [ "CreateNamespace=true", "ServerSideApply=true" ]
{{- end }}
