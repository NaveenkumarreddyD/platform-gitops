# Production pattern: replace the example image with an approved internal image that
# contains Helm 3.14.4 and argocd-vault-plugin 1.18.1.
spec:
  repo:
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-plugin
      - name: cmp-tmp
        emptyDir: {}
      - name: avp-k8s-token
        projected:
          defaultMode: 420
          sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3600
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - configMap:
                name: openshift-service-ca.crt
                items:
                  - key: service-ca.crt
                    path: service-ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      fieldPath: metadata.namespace
    sidecarContainers:
      - name: avp-helm
        image: registry.lac1.biz/gitops/avp-helm:1.18.1-helm3.14.4
        imagePullPolicy: IfNotPresent
        command:
          - /var/run/argocd/argocd-cmp-server
        env:
          - name: HELM_CACHE_HOME
            value: /tmp/helm/cache
          - name: HELM_CONFIG_HOME
            value: /tmp/helm/config
          - name: HELM_DATA_HOME
            value: /tmp/helm/data
          - name: ARGOCD_EXEC_TIMEOUT
            value: "180"
          - name: AVP_TYPE
            value: vault
          - name: AVP_AUTH_TYPE
            value: k8s
          - name: AVP_K8S_ROLE
            value: mas-gitops
          - name: VAULT_ADDR
            value: https://vault-active.vault.svc.cluster.local:8200
          - name: VAULT_CACERT
            value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: var-files
            mountPath: /var/run/argocd
          - name: plugins
            mountPath: /home/argocd/cmp-server/plugins
          - name: cmp-tmp
            mountPath: /tmp
          - name: cmp-plugin
            mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: avp-helm.yaml
          - name: avp-k8s-token
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
