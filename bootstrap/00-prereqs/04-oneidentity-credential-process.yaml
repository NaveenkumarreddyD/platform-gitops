apiVersion: v1
kind: ConfigMap
metadata:
  name: oneidentity-credential-process
  namespace: openshift-gitops
data:
  # AWS shared-config file consumed by the AWS SDK (argocd-vault-plugin and the
  # publisher). It delegates credential resolution to the One Identity Safeguard
  # A2A credential_process below, so no AWS access key is ever stored in-cluster.
  config: |
    [default]
    credential_process = /usr/local/bin/oneidentity-credential-process
  # credential_process implementation. Retrieves the AWS secret access key from
  # One Identity Safeguard over the Application-to-Application (A2A) API using a
  # mutual-TLS client certificate and an A2A API key, then prints AWS credentials
  # in the credential_process JSON format. The AWS access key id is a public
  # identifier supplied via the auth ConfigMap; only the secret access key is
  # fetched from Safeguard. A short Expiration makes the SDK re-fetch on a cycle
  # so Safeguard-side key rotation is picked up automatically.
  credential-process.sh: |
    #!/bin/sh
    set -eu

    : "${SAFEGUARD_A2A_URL:?SAFEGUARD_A2A_URL not set (auth ConfigMap key safeguardA2aUrl)}"
    : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID not set (auth ConfigMap key accessKeyId)}"
    CERT_DIR="${ONEIDENTITY_CERT_DIR:-/var/run/secrets/oneidentity}"
    TTL="${CREDENTIAL_TTL_SECONDS:-900}"

    api_key="$(cat "$CERT_DIR/api-key")"

    # Optional appliance CA. When present, pin trust to it; otherwise rely on the
    # system trust store (mount a CA for a private/internal Safeguard appliance).
    ca_arg=""
    if [ -s "$CERT_DIR/ca.pem" ]; then
      ca_arg="--cacert $CERT_DIR/ca.pem"
    fi

    # Mutual-TLS A2A retrieval. The response body is the managed account password
    # (the AWS secret access key), returned by Safeguard as a JSON-quoted string.
    raw="$(curl -fsS $ca_arg \
      --cert "$CERT_DIR/client-cert.pem" \
      --key "$CERT_DIR/client-key.pem" \
      -H "Authorization: A2A $api_key" \
      -H "Accept: application/json" \
      "$SAFEGUARD_A2A_URL")"

    # Strip optional surrounding quotes and whitespace.
    secret="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*"\{0,1\}//' -e 's/"\{0,1\}[[:space:]]*$//')"
    [ -n "$secret" ] || { echo "empty credential returned by Safeguard A2A" >&2; exit 1; }

    expiration="$(date -u -d "+$TTL seconds" +%Y-%m-%dT%H:%M:%SZ)"

    printf '{"Version":1,"AccessKeyId":"%s","SecretAccessKey":"%s","Expiration":"%s"}\n' \
      "$AWS_ACCESS_KEY_ID" "$secret" "$expiration"
