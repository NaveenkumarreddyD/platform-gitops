# Argo CD Config Management Plugin for Helm plus AWS Secrets Manager substitution.
# The argocd-vault-plugin binary supports AWS Secrets Manager despite its product name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-plugin
  namespace: openshift-gitops
data:
  avp-helm.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: aws-secrets-manager-helm
    spec:
      init:
        command: ["bash","-c"]
        args: ["helm dependency build"]
      generate:
        command: ["bash","-c"]
        args:
          - |
            unset ARGOCD_ENV_AVP_TYPE ARGOCD_ENV_AVP_PATH_VALIDATION
            unset ARGOCD_ENV_AWS_ACCESS_KEY_ID ARGOCD_ENV_AWS_SECRET_ACCESS_KEY ARGOCD_ENV_AWS_SESSION_TOKEN
            helm template "$ARGOCD_APP_NAME" --namespace "$ARGOCD_APP_NAMESPACE" --include-crds -f <(echo "$ARGOCD_ENV_HELM_VALUES") . |
              argocd-vault-plugin generate -
      discover:
        find:
          command: ["sh","-c"]
          args: ["find . -name Chart.yaml"]
