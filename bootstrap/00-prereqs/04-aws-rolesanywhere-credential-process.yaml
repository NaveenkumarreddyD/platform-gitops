apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-rolesanywhere-credential-process
  namespace: openshift-gitops
data:
  config: |
    [default]
    credential_process = /usr/local/bin/aws-rolesanywhere-credential-process
  credential-process.sh: |
    #!/bin/sh
    set -eu

    set -- /usr/local/bin/aws_signing_helper credential-process \
      --certificate /var/run/secrets/aws/roles-anywhere/certificate.pem \
      --private-key /var/run/secrets/aws/roles-anywhere/private-key.pem \
      --role-arn "$AWS_ROLE_ARN" \
      --profile-arn "$AWS_ROLES_ANYWHERE_PROFILE_ARN" \
      --trust-anchor-arn "$AWS_ROLES_ANYWHERE_TRUST_ANCHOR_ARN" \
      --region "$AWS_REGION" \
      --session-duration 900 \
      --role-session-name "$AWS_ROLE_SESSION_NAME"

    if [ -s /var/run/secrets/aws/roles-anywhere/intermediates.pem ]; then
      set -- "$@" --intermediates /var/run/secrets/aws/roles-anywhere/intermediates.pem
    fi

    exec "$@"
