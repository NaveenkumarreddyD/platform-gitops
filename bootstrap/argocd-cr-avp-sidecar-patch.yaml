spec:
  repo:
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-plugin
      - name: custom-tools
        emptyDir: {}
      - name: cmp-tmp
        emptyDir: {}
      - name: aws-rolesanywhere-config
        configMap:
          name: aws-rolesanywhere-credential-process
          defaultMode: 365
      - name: aws-rolesanywhere-certificate
        secret:
          secretName: aws-rolesanywhere-avp
          defaultMode: 288
    initContainers:
      - name: download-tools
        image: registry.access.redhat.com/ubi9/ubi:9.6
        imagePullPolicy: IfNotPresent
        env:
          - name: AVP_VERSION
            value: "1.18.1"
          - name: AVP_SHA256
            value: "9e8e301c0d4e01f050b4df1e47a4137eb0ba459944ed2c32b53ef1571eb93c40"
          - name: HELM_VERSION
            value: "v3.14.4"
          - name: HELM_SHA256
            value: "a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259"
          - name: AWS_SIGNING_HELPER_VERSION
            value: "1.8.4"
          - name: AWS_SIGNING_HELPER_SHA256
            value: "b7568acd6e1517a4e1adaee68d52bfd6284a0e5305677166cd83d43a07c815c9"
        command: ["sh", "-c"]
        args:
          - |
            set -euo pipefail
            curl -fL "https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v${AVP_VERSION}/argocd-vault-plugin_${AVP_VERSION}_linux_amd64" -o /custom-tools/argocd-vault-plugin
            printf '%s  %s\n' "$AVP_SHA256" /custom-tools/argocd-vault-plugin | sha256sum -c -
            chmod 0555 /custom-tools/argocd-vault-plugin

            curl -fL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /custom-tools/helm.tar.gz
            printf '%s  %s\n' "$HELM_SHA256" /custom-tools/helm.tar.gz | sha256sum -c -
            tar -xzf /custom-tools/helm.tar.gz -C /custom-tools
            mv /custom-tools/linux-amd64/helm /custom-tools/helm
            chmod 0555 /custom-tools/helm
            rm -rf /custom-tools/linux-amd64 /custom-tools/helm.tar.gz

            curl -fL "https://rolesanywhere.amazonaws.com/releases/${AWS_SIGNING_HELPER_VERSION}/X86_64/Linux/Amzn2023/aws_signing_helper" -o /custom-tools/aws_signing_helper
            printf '%s  %s\n' "$AWS_SIGNING_HELPER_SHA256" /custom-tools/aws_signing_helper | sha256sum -c -
            chmod 0555 /custom-tools/aws_signing_helper
        volumeMounts:
          - name: custom-tools
            mountPath: /custom-tools
    sidecarContainers:
      - name: avp-helm
        image: registry.access.redhat.com/ubi9/ubi:9.6
        imagePullPolicy: IfNotPresent
        command:
          - /var/run/argocd/argocd-cmp-server
        env:
          - name: HELM_CACHE_HOME
            value: /tmp/helm/cache
          - name: HELM_CONFIG_HOME
            value: /tmp/helm/config
          - name: HELM_DATA_HOME
            value: /tmp/helm/data
          - name: ARGOCD_EXEC_TIMEOUT
            value: "180"
          - name: AVP_TYPE
            value: awssecretsmanager
          - name: AVP_PATH_VALIDATION
            value: '^mas/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+){1,3}$'
          - name: AWS_REGION
            valueFrom:
              configMapKeyRef:
                name: aws-secrets-manager-auth
                key: region
          - name: AWS_ROLE_ARN
            valueFrom:
              configMapKeyRef:
                name: aws-secrets-manager-auth
                key: roleArn
          - name: AWS_ROLES_ANYWHERE_PROFILE_ARN
            valueFrom:
              configMapKeyRef:
                name: aws-secrets-manager-auth
                key: profileArn
          - name: AWS_ROLES_ANYWHERE_TRUST_ANCHOR_ARN
            valueFrom:
              configMapKeyRef:
                name: aws-secrets-manager-auth
                key: trustAnchorArn
          - name: AWS_ROLE_SESSION_NAME
            valueFrom:
              configMapKeyRef:
                name: aws-secrets-manager-auth
                key: roleSessionName
          - name: AWS_CONFIG_FILE
            value: /etc/aws/config
          - name: AWS_PROFILE
            value: default
          - name: AWS_SDK_LOAD_CONFIG
            value: "1"
          - name: AWS_EC2_METADATA_DISABLED
            value: "true"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: var-files
            mountPath: /var/run/argocd
          - name: plugins
            mountPath: /home/argocd/cmp-server/plugins
          - name: cmp-tmp
            mountPath: /tmp
          - name: cmp-plugin
            mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: avp-helm.yaml
          - name: custom-tools
            mountPath: /usr/local/bin/argocd-vault-plugin
            subPath: argocd-vault-plugin
          - name: custom-tools
            mountPath: /usr/local/bin/helm
            subPath: helm
          - name: custom-tools
            mountPath: /usr/local/bin/aws_signing_helper
            subPath: aws_signing_helper
          - name: aws-rolesanywhere-config
            mountPath: /etc/aws/config
            subPath: config
            readOnly: true
          - name: aws-rolesanywhere-config
            mountPath: /usr/local/bin/aws-rolesanywhere-credential-process
            subPath: credential-process.sh
            readOnly: true
          - name: aws-rolesanywhere-certificate
            mountPath: /var/run/secrets/aws/roles-anywhere
            readOnly: true
