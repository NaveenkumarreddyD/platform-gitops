# Vault secrets backend (temporary, until AWS Secrets Manager). Independent component:
# deploy with `./bootstrap/10-vault.sh <env>`. Coupled to the rest only via Vault secret paths.
{{- if has .Values.component (list "vault" "all") }}
---
# The Vault pods mount the OpenShift service-ca bundle, but the Vault chart can't create that
# ConfigMap — so we create it (annotated for cabundle injection) and its namespace here, before
# the pods try to mount them. The serving cert (secret 'vault-tls') is issued by the service-ca
# once the annotated Vault Service below exists.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels: { app.kubernetes.io/part-of: mas-platform }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-ca-bundle
  namespace: vault
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels: { app.kubernetes.io/part-of: mas-platform }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: {{ .Values.argoNamespace }}
  labels: { app.kubernetes.io/part-of: mas-platform, mas.ibm.com/component: vault }
  annotations: { argocd.argoproj.io/sync-wave: "10" }
spec:
  revisionHistoryLimit: 10
  project: {{ .Values.project }}
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: {{ .Values.vault.chartVersion | quote }}
    helm:
      releaseName: vault
      values: |
        global: { openshift: true, enabled: true, tlsDisable: false }
        injector: { enabled: false }
        server:
          enabled: true
          authDelegator: { enabled: true }
          image: { repository: {{ .Values.vault.imageRepository }}, tag: {{ .Values.vault.imageTag | quote }} }
          extraEnvironmentVars:
            VAULT_CACERT: /vault/userconfig/service-ca-bundle/service-ca.crt
            VAULT_TLS_SERVER_NAME: vault-active.vault.svc
          # OpenShift's service-ca issues the serving cert into secret 'vault-tls' (mounted below)
          # because of this annotation on the Vault Service.
          service:
            enabled: true
            annotations:
              service.beta.openshift.io/serving-cert-secret-name: vault-tls
          volumes:
            - name: vault-tls
              secret: { secretName: vault-tls }
            - name: service-ca-bundle
              configMap: { name: service-ca-bundle }
          volumeMounts:
            - { name: vault-tls, mountPath: /vault/userconfig/vault-tls, readOnly: true }
            - { name: service-ca-bundle, mountPath: /vault/userconfig/service-ca-bundle, readOnly: true }
          route:
            enabled: true
            activeService: false
            host: {{ .Values.vault.host }}
            tls: { termination: reencrypt, insecureEdgeTerminationPolicy: Redirect }
          dataStorage:  { enabled: true, size: {{ .Values.vault.dataSize }},  storageClass: {{ .Values.storageClass }}, accessMode: ReadWriteOnce }
          auditStorage: { enabled: true, size: {{ .Values.vault.auditSize }}, storageClass: {{ .Values.storageClass }}, accessMode: ReadWriteOnce }
          ha:
            enabled: true
            replicas: {{ .Values.vault.replicas }}
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true
                listener "tcp" {
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_disable = 0
                  tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                  tls_key_file = "/vault/userconfig/vault-tls/tls.key"
                  tls_client_ca_file = "/vault/userconfig/service-ca-bundle/service-ca.crt"
                }
                storage "raft" {
                  path = "/vault/data"
{{- range $i := until (int .Values.vault.replicas) }}
                  retry_join {
                    leader_api_addr = "https://vault-{{ $i }}.vault-internal:8200"
                    leader_tls_servername = "vault-active.vault.svc"
                    leader_ca_cert_file = "/vault/userconfig/service-ca-bundle/service-ca.crt"
                  }
{{- end }}
                }
                service_registration "kubernetes" {}
          readinessProbe: { enabled: true, path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204" }
          livenessProbe: { enabled: false }
        ui: { enabled: true, serviceType: ClusterIP }
  destination:
    server: "https://kubernetes.default.svc"
    namespace: vault
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
    syncOptions: [ "CreateNamespace=true" ]
{{- end }}
