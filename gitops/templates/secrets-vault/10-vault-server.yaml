# Vault secrets backend (temporary, until AWS Secrets Manager). Independent component:
# deploy with `./bootstrap/10-vault.sh <env>`. Coupled to the rest only via Vault secret paths.
#
# NON-TLS: Vault runs HTTP (tls_disable=1). Traffic is in-cluster only; secrets travel the pod
# network in the clear. This deliberately drops the OpenShift service-ca serving cert, whose SAN
# was issued non-deterministically across the vault / vault-active / vault-standby services and
# caused endless cert-name mismatches. Every consumer (lib-bootstrap, AVP sidecar, SLS/DRO harvest,
# INSTALL.md) uses http://…:8200 with no VAULT_CACERT / VAULT_TLS_SERVER_NAME. Re-enable TLS by
# restoring the serving cert + tls_cert/tls_key listener config if this becomes a long-lived Vault.
{{- if has .Values.component (list "vault" "all") }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels: { app.kubernetes.io/part-of: mas-platform }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: {{ .Values.argoNamespace }}
  labels: { app.kubernetes.io/part-of: mas-platform, mas.ibm.com/component: vault }
  annotations: { argocd.argoproj.io/sync-wave: "10" }
spec:
  revisionHistoryLimit: 10
  project: {{ .Values.project }}
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: {{ .Values.vault.chartVersion | quote }}
    helm:
      releaseName: vault
      values: |
        global: { openshift: true, enabled: true, tlsDisable: true }
        injector: { enabled: false }
        server:
          enabled: true
          authDelegator: { enabled: true }
          image: { repository: {{ .Values.vault.imageRepository }}, tag: {{ .Values.vault.imageTag | quote }} }
          service:
            enabled: true
          route:
            enabled: true
            # UI route to the active pod; the router terminates TLS (edge) and forwards HTTP to the
            # HTTP backend. No reencrypt / destinationCACertificate needed (Vault is plain HTTP).
            activeService: true
            host: {{ .Values.vault.host }}
            tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
          dataStorage:  { enabled: true, size: {{ .Values.vault.dataSize }},  storageClass: {{ .Values.storageClass }}, accessMode: ReadWriteOnce }
          auditStorage: { enabled: true, size: {{ .Values.vault.auditSize }}, storageClass: {{ .Values.storageClass }}, accessMode: ReadWriteOnce }
          ha:
            enabled: true
            replicas: {{ .Values.vault.replicas }}
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true
                listener "tcp" {
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_disable = 1
                }
                storage "raft" {
                  path = "/vault/data"
{{- range $i := until (int .Values.vault.replicas) }}
                  retry_join {
                    leader_api_addr = "http://vault-{{ $i }}.vault-internal:8200"
                  }
{{- end }}
                }
                service_registration "kubernetes" {}
          readinessProbe: { enabled: true, path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204" }
          livenessProbe: { enabled: false }
        ui: { enabled: true, serviceType: ClusterIP }
  destination:
    server: "https://kubernetes.default.svc"
    namespace: vault
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
    syncOptions: [ "CreateNamespace=true" ]
{{- end }}
