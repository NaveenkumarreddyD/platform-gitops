{{- /*
Render-time guards. These fail the Helm render with a clear message instead of
letting a bad value pass and fail late at Argo CD sync time (a broken AWS secret
name, an unsupported IBM source, etc.). Rendered on every component render.
*/ -}}

{{- /* 1. component must be a known value. Set by the bootstrap scripts (--set component=…). */ -}}
{{- $validComponents := list "operators" "mongodb-operator" "mongodb-instance" "mongodb" "mas" "grafana" "all" -}}
{{- if not (has .Values.component $validComponents) -}}
{{- fail (printf "component is '%v' — must be one of: operators, mongodb-operator, mongodb-instance, mongodb, mas, grafana, all" .Values.component) -}}
{{- end -}}

{{- /* 2. Identity must be set. Empty IDs build a broken AWS secret name. */ -}}
{{- if not .Values.clusterId -}}
{{- fail "clusterId must be set in gitops/envs/<cluster>/common.yaml" -}}
{{- end -}}
{{- if not (.Values.account).id -}}
{{- fail "account.id must be set in gitops/envs/<cluster>/common.yaml (unique per env, convention: = clusterId). It is the config-repo glob prefix and AWS secret prefix; two envs sharing it cross-generate each other's apps." -}}
{{- end -}}
{{- if not .Values.instanceId -}}
{{- fail "instanceId must be set in gitops/envs/<cluster>/values.yaml" -}}
{{- end -}}
{{- if not (.Values.mongo).namespace -}}
{{- fail "mongo.namespace must be set in gitops/envs/<cluster>/values.yaml" -}}
{{- end -}}

{{- /* 3. Use the reviewed IBM MAS GitOps fork (stock 8.4.2 plus the JDBC sslEnabled patch). */ -}}
{{- $repo := (.Values.source).repo_url | toString -}}
{{- if ne $repo "https://gitlab.lac1.biz/gitops/ibm-gitops.git" -}}
{{- fail (printf "source.repo_url is '%s'; use the internal IBM MAS GitOps fork https://gitlab.lac1.biz/gitops/ibm-gitops.git" $repo) -}}
{{- end -}}
{{- $rev := (.Values.source).revision | toString -}}
{{- if ne $rev "official-8.4.2" -}}
{{- fail (printf "source.revision is '%s'; this repository is verified against the internal IBM MAS GitOps fork revision official-8.4.2 (stock 8.4.2 plus the JDBC sslEnabled patch)" $rev) -}}
{{- end -}}
