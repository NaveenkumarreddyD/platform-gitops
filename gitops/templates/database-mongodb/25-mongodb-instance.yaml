# Dedicated MongoDB instance for MAS (independent component: ./bootstrap/20-mongodb.sh <env>).
{{- if has .Values.component (list "mongodb-instance" "mongodb" "all") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: {{ .Values.argoNamespace }}
  labels: { app.kubernetes.io/part-of: mas-platform, mas.ibm.com/component: mongodb }
  annotations: { argocd.argoproj.io/sync-wave: "25" }
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  revisionHistoryLimit: 10
  project: {{ .Values.project }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ include "gitops.mongoNs" . }}
  source:
    repoURL: {{ .Values.platform.repo_url | quote }}
    targetRevision: {{ .Values.platform.revision | quote }}
    path: workloads/mongodb
    plugin:
      name: aws-secrets-manager-helm
      env:
        - name: HELM_VALUES
          value: |
            namespace: {{ include "gitops.mongoNs" . }}
            resource: {{ .Values.instanceId }}-mongo
            members: {{ .Values.mongo.members }}
            mongodbVersion: "{{ .Values.mongo.version }}"
            mongodbImage: "{{ .Values.mongoImage.repo }}/{{ .Values.mongoImage.name }}:{{ .Values.mongo.version }}-{{ .Values.mongoImage.imageType }}"
            storageClass: {{ .Values.storageClass }}
            adminUser: {{ .Values.mongo.adminUser }}
            adminPasswordPath: "<path:{{ include "gitops.path" . }}/mongo#password>"
            slsmongoPasswordPath: "<path:{{ include "gitops.path" . }}/sls-mongo#password>"
            # The Mongo CA is generated and rotated by cert-manager IN-CLUSTER (private key
            # never leaves the cluster). Its PUBLIC certificate is published to AWS Secrets
            # Manager (mongo#ca.crt) so MAS/SLS can trust the connection.
            publishCa:
              enabled: true
              image: {{ .Values.generatedSecretsPublisher.image | quote }}
              credentialsSecret: {{ .Values.generatedSecretsPublisher.identitySecret | quote }}
              mongoSecretPath: "{{ include "gitops.path" . }}/mongo"
  syncPolicy:
    automated: { prune: {{ .Values.auto_delete }}, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
    syncOptions: [ "CreateNamespace=true" ]
{{- end }}
