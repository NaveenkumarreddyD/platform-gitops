# IBM's 8.4.2 write-back Jobs require long-lived access keys and publish a different
# field contract. This separate application preserves the official chart unchanged and
# publishes the generated DRO/SLS values with short-lived IAM Roles Anywhere credentials.
{{- if and .Values.generatedSecretsPublisher.enabled (has .Values.component (list "mas" "all")) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-generated-secrets-publisher-{{ .Values.clusterId }}
  namespace: {{ .Values.argoNamespace }}
  labels:
    app.kubernetes.io/part-of: mas-platform
    mas.ibm.com/component: generated-secrets-publisher
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  revisionHistoryLimit: 10
  project: {{ .Values.project }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ .Values.generatedSecretsPublisher.namespace }}
  source:
    repoURL: {{ .Values.platform.repo_url | quote }}
    targetRevision: {{ .Values.platform.revision | quote }}
    path: workloads/aws-generated-secrets-publisher
    helm:
      values: |
        namespace: {{ .Values.generatedSecretsPublisher.namespace | quote }}
        accountId: {{ .Values.account.id | quote }}
        clusterId: {{ .Values.clusterId | quote }}
        instanceId: {{ .Values.instanceId | quote }}
        droNamespace: {{ .Values.generatedSecretsPublisher.droNamespace | quote }}
        slsNamespace: {{ printf "mas-%s-sls" .Values.instanceId | quote }}
        pollSeconds: {{ .Values.generatedSecretsPublisher.pollSeconds }}
        authConfigMap: {{ .Values.generatedSecretsPublisher.authConfigMap | quote }}
        identitySecret: {{ .Values.generatedSecretsPublisher.identitySecret | quote }}
        image: {{ .Values.generatedSecretsPublisher.image | quote }}
        signingHelper:
          version: {{ .Values.generatedSecretsPublisher.signingHelperVersion | quote }}
          sha256: {{ .Values.generatedSecretsPublisher.signingHelperSha256 | quote }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: -1
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
{{- end }}
