# Official IBM MAS account-root (independent component: ./bootstrap/30-mas.sh <env>).
# Points at IBM MAS GitOps and lets IBM charts create Suite, Workspace, Manage, SLS, and configs.
{{- if has .Values.component (list "mas" "all") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ibm-mas-account-root
  namespace: {{ .Values.argoNamespace }}
  labels:
    app.kubernetes.io/part-of: mas-platform
    mas.ibm.com/component: mas
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  revisionHistoryLimit: 10
  project: {{ .Values.project }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ .Values.argoNamespace }}
  source:
    repoURL: {{ .Values.source.repo_url | quote }}
    targetRevision: {{ .Values.source.revision | quote }}
    path: root-applications/ibm-mas-account-root
    helm:
      values: |
        avp: { name: argocd-vault-plugin-helm, values_varname: HELM_VALUES }
        account: { id: {{ .Values.account.id }} }
        source:
          repo_url: {{ .Values.source.repo_url | quote }}
          revision: {{ .Values.source.revision | quote }}
        generator:
          repo_url: {{ .Values.generator.repo_url | quote }}
          revision: {{ .Values.generator.revision | quote }}
        argo:
          namespace: {{ .Values.argoNamespace }}
          projects: { rootapps: {{ .Values.project }}, apps: {{ .Values.project }} }
        cluster_admin_role: {{ .Values.accountRoot.clusterAdminRole }}
        application_admin_role: {{ .Values.accountRoot.applicationAdminRole }}
        auto_delete: false
{{- if .Values.accountRoot.autoSync }}
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
{{- else }}
  # Intentionally no automated syncPolicy. An operator must manually sync this
  # Application after the prerequisites and Vault preflight checks pass.
{{- end }}
{{- end }}
